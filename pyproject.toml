[project]
name = "lsio-builder"
version = "0.1.0"
description = "LinuxServer v2 contracts (schemas and validator) and the image manifest renderer."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
  "jsonschema==4.25.1",
  "referencing==0.36.2",
  "pyyaml==6.0.3",
  "rfc3339-validator==0.1.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "types-PyYAML==6.0.12.20260906",
  "types-jsonschema==4.25.1.20250822",
]

[tool.lsio]
contracts_version = "1.0"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts"]

[tool.setuptools.package-data]
contracts = ["../schemas/*.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
